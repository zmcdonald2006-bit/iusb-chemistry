<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Chem Companion</title>
  <meta name="description" content="Study guide for C102 Elementary Chemistry II: lecture notes, unlimited practice, flashcards and progress tracking.">
  <meta name="theme-color" content="#f4f5fa">
  <meta name="color-scheme" content="light dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Chem">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="assets/icons/icon-192.png" sizes="192x192" type="image/png">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/app.css">
  <script>
    // Apply the saved theme before first paint (avoids a flash of the wrong theme).
    try {
      var s = JSON.parse(localStorage.getItem('chem-companion:v1') || 'null');
      var p = s && s.profile;
      if (p && (p.theme === 'light' || p.theme === 'dark')) document.documentElement.setAttribute('data-theme', p.theme);
      document.documentElement.setAttribute('data-accent', (p && p.accent) || 'violet');
    } catch (e) { /* ignore */ }
  </script>
</head>
<body>
  <a class="sr-only" href="#main">Skip to content</a>
  <div id="app" class="app">
    <div class="loading" role="status">Loading…</div>
  </div>
  <noscript>
    <div style="padding:24px;font-family:system-ui">Chem Companion needs JavaScript turned on.</div>
  </noscript>
  <script type="module" src="js/app.js"></script>
  <script>
    // If modules fail to load (very old browser), show a helpful message.
    setTimeout(function () {
      var app = document.getElementById('app');
      if (app && app.querySelector('.loading')) {
        app.innerHTML = '<div style="padding:24px;font-family:system-ui;max-width:520px;margin:auto"><h2>Still loading…</h2><p>If this doesn\'t go away, try refreshing. This app needs an up-to-date browser (Safari 15+, Chrome, Edge or Firefox).</p></div>';
      }
    }, 12000);
  </script>
</body>
</html>
