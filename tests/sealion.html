<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sea lion art</title>
<link rel="stylesheet" href="../css/app.css">
<style>
  body { font: 14px/1.4 system-ui, sans-serif; margin: 16px; background: #fff; color: #111; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
  figure { margin: 0; } figcaption { font-weight: 600; margin-top: 4px; }
  canvas { width: 100%; height: 200px; display: block; border-radius: 12px; }
  canvas.stage { height: 420px; }
</style>
</head>
<body>
<h1>Sea Lion Splash — art sheet</h1>
<p>Dev page: every outfit and ocean, plus a game frame with rings, fish and power-ups.</p>
<h2>Outfits</h2><div class="grid" id="outfits"></div>
<h2>Oceans</h2><div class="grid" id="themes"></div>
<h2>Game frame</h2><div class="grid" id="frame"></div>
<h2>Answer signs (text and structures)</h2>
<div id="signs" style="position:relative; height:330px; max-width:420px; background:#1a7fb0; border-radius:12px;"></div>
<script type="module">
import { OUTFITS, THEMES } from '../content/game.js';
import { paintScene } from '../js/views/game.js';
import { stageGeometry, drawBackground, drawLanes, drawSeaLion, drawRing, drawRocks, drawFish, drawBubbleShield, drawMagnet, LANE_COLORS } from '../js/game/draw.js';
import { PLAYER_X } from '../js/game/engine.js';
import { molView } from '../js/ui/components.js';
import { h, mdi } from '../js/ui/dom.js';

// Signs exactly as the game builds them (see optionView/showSigns in js/views/gameplay.js)
const signHost = document.getElementById('signs');
const opts = [{ label: '3-ethyl-2-methylhexane' }, { smiles: 'CC(C)=O' }, { smiles: 'CCC(O)CC' }, { label: 'H₂O, H₂SO₄' }, { smiles: 'CC(Br)C(Br)C' }];
opts.forEach((o, i) => {
  const inner = o.smiles ? h('span', { class: 'g-opt-mol sign' }, molView({ smiles: o.smiles, plain: true, scale: 15 })) : mdi(o.label, 'span', 'g-opt-text sign');
  const el = h('button', { type: 'button', class: `g-sign ${i === 1 ? 'ok' : i === 2 ? 'bad' : ''}` }, h('span', { class: 'g-sign-dot', style: { background: LANE_COLORS[i % 3] } }), inner);
  el.style.top = `${36 + i * 64}px`;
  signHost.appendChild(el);
});
signHost.appendChild(h('button', { type: 'button', class: 'g-dash' }, 'Dash'));

const fig = (host, label, cls = '') => {
  const c = document.createElement('canvas');
  if (cls) c.className = cls;
  const f = document.createElement('figure');
  const cap = document.createElement('figcaption');
  cap.textContent = label;
  f.append(c, cap);
  document.getElementById(host).appendChild(f);
  return c;
};
for (const o of OUTFITS) { const c = fig('outfits', o.name); requestAnimationFrame(() => paintScene(c, 'bay', o.id, 1.3, false, true)); }
for (const t of THEMES) { const c = fig('themes', t.name); requestAnimationFrame(() => paintScene(c, t.id, 'natural', 1.3, false, false)); }
for (const theme of ['bay', 'night']) {
  const c = fig('frame', `In game (${theme})`, 'stage');
  requestAnimationFrame(() => {
    const r = c.getBoundingClientRect();
    const dpr = Math.min(devicePixelRatio || 1, 2);
    c.width = r.width * dpr; c.height = r.height * dpr;
    const ctx = c.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const g = stageGeometry(r.width, r.height, PLAYER_X);
    drawBackground(ctx, g, theme, 0.4, 2);
    drawLanes(ctx, g, 0.4);
    const rr = g.laneGap * 0.38;
    const gx = g.W * 0.62;
    [0, 1, 2].forEach((l) => drawRing(ctx, gx, g.laneY[l], rr, LANE_COLORS[l], 'back'));
    drawRocks(ctx, g.W * 0.9, g.laneY[2], rr * 0.8);
    for (let i = 0; i < 4; i++) drawFish(ctx, g.W * (0.36 + i * 0.05), g.laneY[0], g.s * 0.7, 2 + i);
    drawBubbleShield(ctx, g.W * 0.45, g.laneY[2], g.s * 0.75, 2);
    drawMagnet(ctx, g.W * 0.82, g.laneY[0], g.s * 0.75, 2);
    const y = g.laneY[1] + g.s * 0.18;
    drawSeaLion(ctx, g.px, y, g.s, 2, { outfit: 'goggles', tilt: 0.05 });
    drawBubbleShield(ctx, g.px + g.s * 0.15, y - g.s * 0.15, g.s * 1.75, 2, 0.75);
    [0, 1, 2].forEach((l) => drawRing(ctx, gx, g.laneY[l], rr, LANE_COLORS[l], 'front'));
    // a ring passing over the sea lion
    drawRing(ctx, g.px, g.laneY[1], rr, LANE_COLORS[1], 'front', 'ok');
  });
}
</script>
</body>
</html>
