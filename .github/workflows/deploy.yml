# Runs the full test suite on every push and pull request. On pushes to main, and only
# if the tests pass, it regenerates the service worker and publishes the site:
#   - to GitHub Pages (https://<you>.github.io/<repo>/)
#   - to Firebase Hosting (https://iusb-chem.firebaseapp.com), once the FIREBASE_SERVICE_ACCOUNT_IUSB_CHEM
#     secret exists. That address is where Google sign-in works on iPhones; see docs/GOOGLE_SIGN_IN.md.
#
# One-time setup: repo Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Test & deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Unit + content tests
        run: node tests/run.js

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - name: Build service worker (offline cache + update detection)
        run: ruby tools/build-sw.rb
      - name: Assemble site (app files only — no tests or tools)
        run: |
          mkdir -p _site
          cp -r index.html manifest.webmanifest sw.js .nojekyll css js content assets _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4

  deploy-firebase:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_IUSB_CHEM }}
    steps:
      - name: Firebase Hosting key not added yet
        if: env.FIREBASE_SA == ''
        run: echo "No FIREBASE_SERVICE_ACCOUNT_IUSB_CHEM secret yet, so Firebase Hosting is skipped. See docs/GOOGLE_SIGN_IN.md."
      - uses: actions/checkout@v4
        if: env.FIREBASE_SA != ''
      - uses: ruby/setup-ruby@v1
        if: env.FIREBASE_SA != ''
        with:
          ruby-version: '3.3'
      - name: Build service worker and assemble site
        if: env.FIREBASE_SA != ''
        run: |
          ruby tools/build-sw.rb
          mkdir -p _site
          cp -r index.html manifest.webmanifest sw.js css js content assets _site/
      - uses: FirebaseExtended/action-hosting-deploy@v0
        if: env.FIREBASE_SA != ''
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_IUSB_CHEM }}
          projectId: iusb-chem
          channelId: live
